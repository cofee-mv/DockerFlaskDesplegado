services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" #Http
      - "81:81" #Administración de la API
      - "443:443" #Https
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-ejemplo-082

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - red-ejemplo-082

  db:
    image: mysql:8.0
    container_name: servidor-bd-082
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-ejemplo-082

  app-backend:
    build: .
    container_name: backend-082
    restart: always
    depends_on:
      - db
    ports:
      - "5050:5050"
    networks:
      - red-ejemplo-082

volumes:
  mysql-data:
    name: mysql-data
  uptime-kuma-data:
    name: uptime-kume-data
networks:
  red-ejemplo-082:
    name: red-ejemplo-082
